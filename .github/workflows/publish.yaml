name: Publish to GitHub Packages

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # macOS arm64 runners are capacity-constrained (15 min queue timeout),
    # so build both Linux targets on an x64 Linux host: linuxX64 natively and
    # linuxArm64 via cross-compilation.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Linux artifacts
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >
          ./gradlew
          :mqtt-core:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          :mqtt-core:publishLinuxArm64PublicationToGitHubPackagesRepository
          :mqtt-core:publishLinuxX64PublicationToGitHubPackagesRepository
          :mqtt-client:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          :mqtt-client:publishLinuxArm64PublicationToGitHubPackagesRepository
          :mqtt-client:publishLinuxX64PublicationToGitHubPackagesRepository
          --no-configuration-cache
